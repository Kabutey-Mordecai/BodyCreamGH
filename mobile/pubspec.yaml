name: cosmetics_app
description: Ghana cosmetics e-commerce mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  http: ^1.1.0

  # Secure storage for JWT tokens (uses Android Keystore / iOS Keychain)
  flutter_secure_storage: ^9.0.0

  # State management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # In-app WebView for Paystack payment page
  webview_flutter: ^4.4.2

  # Image loading with caching
  cached_network_image: ^3.3.0

  # Shared preferences for non-sensitive settings (e.g. theme preference)
  shared_preferences: ^2.2.2

  # Pull-to-refresh
  pull_to_refresh: ^2.0.0

  # Intl for date/currency formatting
  intl: ^0.19.0

  # Launch external URLs (WhatsApp, tel:, mailto:, social links)
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
