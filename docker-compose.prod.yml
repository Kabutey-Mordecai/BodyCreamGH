# =============================================================================
# docker-compose.prod.yml — Production Docker stack
#
# Runs the backend + PostgreSQL + Nginx in containers on any VPS that has
# Docker installed (alternative to the PM2 + host Nginx setup).
#
# USAGE (on the server):
#   # First time — build and start everything
#   docker-compose -f docker-compose.prod.yml up -d --build
#
#   # Run migrations (only needed after first start or after adding new files)
#   docker-compose -f docker-compose.prod.yml exec backend npm run migrate
#
#   # Redeploy after a git pull (zero-downtime rolling restart)
#   docker-compose -f docker-compose.prod.yml up -d --build --no-deps backend
#
#   # View logs
#   docker-compose -f docker-compose.prod.yml logs -f backend
#
# SECRETS:
#   1. Create backend/.env from backend/.env.production.example (backend config).
#   2. Create deploy/postgres.env from deploy/postgres.env.example (DB init creds).
#      Keep DB_NAME / DB_USER / DB_PASSWORD in both files in sync.
#   Neither file must ever be committed — both are listed in .gitignore.
# =============================================================================

services:

  # ── PostgreSQL 15 ───────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: always
    # deploy/postgres.env provides POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD.
    # These variable names are what the postgres image requires for initialisation.
    # Create this file from deploy/postgres.env.example before first run.
    # Do NOT use backend/.env here: Compose env_file injects vars into the
    # container only — it does NOT make them available for YAML ${} substitution,
    # so ${DB_NAME} style references would expand to empty strings.
    env_file: ./deploy/postgres.env
    volumes:
      # Named volume — data survives container rebuilds and restarts
      - postgres_prod_data:/var/lib/postgresql/data
    # Do NOT expose 5432 to the host in production — only the backend needs it
    healthcheck:
      # pg_isready without flags uses the container's own postgres defaults,
      # avoiding YAML variable-substitution that would fail without a root .env.
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node.js backend (production image) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile   # uses the production multi-stage build
    restart: always
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      # Override DB_HOST so the backend reaches the Compose db service
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    # Backend is NOT exposed directly — only Nginx talks to it
    expose:
      - "3000"
    volumes:
      # Named volume keeps uploaded product images across rebuilds and restarts.
      # Without this, every `docker-compose up -d --build` wipes /app/uploads.
      - product_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Background workers (single instance — must NOT be scaled) ────────────────
  # Runs pg-boss, payment/shipment/notification/reconciliation workers.
  # Uses the same image as the backend service but overrides the default CMD.
  # The Dockerfile HEALTHCHECK pings HTTP localhost:3000 — disabled here because
  # the worker has no HTTP server. Docker would mark it unhealthy otherwise.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "src/worker.js"]
    restart: always
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      # Override so the worker reaches the Compose db service, same as backend
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true

  # ── Nginx reverse proxy + SSL termination ────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount the Docker-specific Nginx config (uses http://backend:3000 and
      # /var/www/uploads alias). For PM2/VPS, use deploy/nginx.host.conf instead.
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount Let's Encrypt certificates (issue them on the host first with certbot)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      # Read-only access to uploaded images so Nginx can serve /uploads directly.
      # Add a `location /uploads` block in nginx.conf to activate this (see below).
      - product_uploads:/var/www/uploads:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_prod_data:
    # labelled so it's easy to find in `docker volume ls`
    labels:
      com.cosmetics.description: "PostgreSQL production data"
  product_uploads:
    labels:
      com.cosmetics.description: "Product image uploads — shared between backend (rw) and Nginx (ro)"
