# =============================================================================
# docker-compose.yml — Turnkey Commercial E-Commerce Stack
#
# Launches the complete 4-tier ecosystem in one command:
#   1. PostgreSQL 15 Database (db)
#   2. Node.js Express REST API & Worker (backend)
#   3. Customer Storefront Web App (frontend)
#   4. Multi-Role Admin ERP Dashboard (admin)
#
# USAGE:
#   docker-compose up --build
#
# ACCESS:
#   Storefront:      http://localhost:3000
#   Admin Dashboard: http://localhost:3001
#   Backend API:     http://localhost:5000/api
#   Database:        localhost:5432 (cosmetics_db)
# =============================================================================

services:

  # ── PostgreSQL 15 Database ──────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       cosmetics_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: mord123
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cosmetics_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Node.js REST API & Queue Worker ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV:    production
      PORT:        5000
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     cosmetics_db
      DB_USER:     postgres
      DB_PASSWORD: mord123
      JWT_SECRET:  supersecretjwtkeyforbodycreamghana2026
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # ── Customer Storefront Web App ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ── Multi-Role Admin ERP Dashboard ──────────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_dev_data:
