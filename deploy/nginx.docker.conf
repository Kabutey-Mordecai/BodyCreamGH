# =============================================================================
# nginx.docker.conf — Nginx config for the Docker Compose production stack
#
# Mounted into the Nginx container by docker-compose.prod.yml:
#   ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
#
# Key Docker assumptions:
#   - Backend is reachable at http://backend:3000 (Compose service name).
#   - Uploaded product images are on the shared "product_uploads" named volume,
#     mounted into Nginx at /var/www/uploads (read-only).
#
# SETUP:
#   1. Replace every occurrence of "api.yourdomain.com" with your real domain.
#   2. Start the stack:
#        docker-compose -f docker-compose.prod.yml up -d --build
#   3. Issue a certificate (Certbot must reach port 80 before this works):
#        docker-compose -f docker-compose.prod.yml exec nginx \
#          certbot --nginx -d api.yourdomain.com
#
# For a plain PM2 / VPS deployment, use deploy/nginx.host.conf instead.
# =============================================================================

# Redirect plain HTTP → HTTPS so all traffic is encrypted.
server {
    listen 80;
    server_name api.yourdomain.com;   # <-- replace with your domain

    # Let's Encrypt challenge files (Certbot writes these during cert issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Certbot will fill in the ssl_certificate paths after it runs.
server {
    listen 443 ssl;
    server_name api.yourdomain.com;   # <-- replace with your domain

    # ── SSL certificates (managed by Certbot) ────────────────────────────────
    # These lines will be uncommented/populated automatically by Certbot.
    # ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "DENY"            always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header X-XSS-Protection       "1; mode=block"   always;
    add_header Referrer-Policy        "strict-origin"   always;

    # ── Request size limit ────────────────────────────────────────────────────
    # 8 files × 5 MB max = 40 MB theoretical ceiling per upload batch.
    # 42 M gives a small buffer above that.
    client_max_body_size 42M;

    # ── Serve uploaded product images directly from the shared Docker volume ──
    # The product_uploads named volume is mounted at /var/www/uploads (ro).
    # Serving from Nginx avoids proxying static files through Node.js.
    location /uploads/ {
        alias      /var/www/uploads/;
        autoindex  off;
        expires    30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Proxy all /api/* requests to the Node.js backend ─────────────────────
    # Docker Compose service name resolves to the backend container's IP.
    # Do NOT change this to 127.0.0.1 — that is the Nginx container's loopback,
    # not the backend container.
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── Health check endpoint ─────────────────────────────────────────────────
    location /health {
        proxy_pass http://backend:3000/api/health;
    }

    # ── Block direct access to hidden files (e.g. .env, .git) ────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
