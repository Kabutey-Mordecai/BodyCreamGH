# =============================================================================
# nginx.docker.conf — Nginx config for the Docker Compose production stack
#
# Mounted into the Nginx container by docker-compose.prod.yml:
#   ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
#
# Key Docker assumptions:
#   - Backend is reachable at http://backend:3000 (Compose service name).
#   - Uploaded product images are on the shared "product_uploads" named volume,
#     mounted into Nginx at /var/www/uploads (read-only).
#
# SETUP:
#   1. Replace every occurrence of "api.yourdomain.com" with your real domain.
#   2. Start the stack:
#        docker-compose -f docker-compose.prod.yml up -d --build
#   3. Issue a certificate (Certbot must reach port 80 before this works):
#        docker-compose -f docker-compose.prod.yml exec nginx \
#          certbot --nginx -d api.yourdomain.com
#
# For a plain PM2 / VPS deployment, use deploy/nginx.host.conf instead.
# =============================================================================

# Hide Nginx version from Server header and error pages.
server_tokens off;

# Compress JSON API responses, CSS, JS, and SVG sprites for Ghana mobile networks.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types application/json text/css application/javascript image/svg+xml application/xml text/plain;

# Redirect plain HTTP → HTTPS so all traffic is encrypted.
server {
    listen 80;
    server_name api.yourdomain.com;   # <-- replace with your domain

    # Let's Encrypt challenge files (Certbot writes these during cert issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Certbot will fill in the ssl_certificate paths after it runs.
server {
    listen 443 ssl;
    server_name api.yourdomain.com;   # <-- replace with your domain

    # ── SSL certificates (managed by Certbot) ────────────────────────────────
    # These lines will be uncommented/populated automatically by Certbot.
    # ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers (server block) ──────────────────────────────────────
    # These apply to all locations that do NOT define their own add_header
    # (Nginx does not inherit server-block headers into locations that have
    # their own add_header directives — see /uploads/ below).
    #
    # Express (helmet) also sets most of these headers for /api/ responses.
    # The duplication is intentional: defense-in-depth for consistent headers
    # even if Express is bypassed or helmet misconfigured.
    add_header X-Frame-Options        "DENY"          always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin" always;

    # HSTS: force HTTPS for one year (including subdomains).
    # Only add to HTTPS server blocks — never to port 80.
    # WARNING: ensure all subdomains serve valid HTTPS before enabling includeSubDomains.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Restrict access to browser features — this API does not use camera,
    # microphone, geolocation, or payment APIs from the browser.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── Request size limit ────────────────────────────────────────────────────
    # 8 files × 5 MB max = 40 MB theoretical ceiling per upload batch.
    # 42 M gives a small buffer above that.
    client_max_body_size 42M;

    # ── Serve uploaded product images from the shared Docker volume ───────────
    # IMPORTANT: this location has its own add_header directives, so it does NOT
    # inherit the server-block headers above. All desired headers must be listed
    # explicitly here.
    location /uploads/ {
        alias      /var/www/uploads/;
        autoindex  off;
        access_log off;

        # Prevent browsers from guessing a different content-type for image files.
        add_header X-Content-Type-Options "nosniff" always;

        # Prevent these static assets from being embedded in frames.
        add_header X-Frame-Options "DENY" always;

        # Display images inline; do not trigger a forced download dialog.
        add_header Content-Disposition "inline" always;

        # Strict CSP: images in this directory must not load or execute anything.
        # This is a last line of defense against a polyglot file (e.g., a valid
        # JPEG that also contains executable HTML/JS) being rendered as a page.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;

        # Block direct requests for server-side script extensions even though
        # Nginx serves static files and cannot execute them — defense in depth.
        location ~* \.(php|php5|phtml|pl|py|jsp|asp|sh|cgi)$ {
            deny   all;
            return 404;
        }

        expires    30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Proxy all /api/* requests to the Node.js backend ─────────────────────
    # Docker Compose service name resolves to the backend container's IP.
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── Health check endpoint ─────────────────────────────────────────────────
    location /health {
        proxy_pass http://backend:3000/api/health;
    }

    # ── Block direct access to hidden files (e.g. .env, .git) ────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
