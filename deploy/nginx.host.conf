# =============================================================================
# nginx.host.conf — Nginx config for PM2 / bare-VPS deployment
#
# INSTALL:
#   1. Copy this file to the Nginx sites directory on the server:
#        cp deploy/nginx.host.conf /etc/nginx/sites-available/cosmetics
#   2. Replace EVERY occurrence of "api.yourdomain.com" with your real domain.
#   3. Enable the site:
#        ln -s /etc/nginx/sites-available/cosmetics /etc/nginx/sites-enabled/
#   4. Test the config:
#        nginx -t
#   5. Obtain a free SSL certificate (Certbot rewrites this file automatically):
#        certbot --nginx -d api.yourdomain.com
#   6. Reload Nginx:
#        systemctl reload nginx
#
# Key PM2/host assumptions:
#   - Node.js (PM2) listens on 127.0.0.1:3000 on the same host.
#   - Uploaded product images are on the host filesystem at
#     /home/deploy/app/backend/uploads/ (the APP_DIR used by server-setup.sh).
#
# For a Docker Compose deployment, use deploy/nginx.docker.conf instead.
# =============================================================================

# Redirect plain HTTP → HTTPS so all traffic is encrypted.
server {
    listen 80;
    server_name api.yourdomain.com;   # <-- replace with your domain

    # Let's Encrypt challenge files (Certbot writes these during cert issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Certbot will fill in the ssl_certificate paths after it runs.
server {
    listen 443 ssl;
    server_name api.yourdomain.com;   # <-- replace with your domain

    # ── SSL certificates (managed by Certbot) ────────────────────────────────
    # These lines will be uncommented/populated automatically by Certbot.
    # ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "DENY"            always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header X-XSS-Protection       "1; mode=block"   always;
    add_header Referrer-Policy        "strict-origin"   always;

    # ── Request size limit ────────────────────────────────────────────────────
    # 8 files × 5 MB max = 40 MB theoretical ceiling per upload batch.
    # 42 M gives a small buffer above that.
    client_max_body_size 42M;

    # ── Serve uploaded product images directly from the host filesystem ───────
    # APP_DIR from server-setup.sh is /home/deploy/app — uploads land here.
    # Serving from Nginx avoids proxying static files through Node.js.
    location /uploads/ {
        alias      /home/deploy/app/backend/uploads/;
        autoindex  off;
        expires    30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Proxy all /api/* requests to the Node.js backend ─────────────────────
    # PM2 runs Node.js on the same host — 127.0.0.1:3000 is correct here.
    # Do NOT use this address in the Docker config — it would point to the
    # Nginx container's own loopback, not the backend container.
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── Health check endpoint ─────────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:3000/api/health;
    }

    # ── Block direct access to hidden files (e.g. .env, .git) ────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
