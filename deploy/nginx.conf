# =============================================================================
# Nginx config for the BodyCream GH API server
#
# INSTALL:
#   1. Copy this file:
#        cp deploy/nginx.conf /etc/nginx/sites-available/cosmetics
#   2. Replace EVERY occurrence of "api.yourdomain.com" with your real domain.
#   3. Enable the site:
#        ln -s /etc/nginx/sites-available/cosmetics /etc/nginx/sites-enabled/
#   4. Test the config:
#        nginx -t
#   5. Obtain a free SSL certificate (Certbot rewrites this file automatically):
#        certbot --nginx -d api.yourdomain.com
#   6. Reload Nginx:
#        systemctl reload nginx
# =============================================================================

# Redirect plain HTTP → HTTPS so all traffic is encrypted.
# Certbot will update this block with the SSL redirect after step 5.
server {
    listen 80;
    server_name api.yourdomain.com;   # <-- replace with your domain

    # Let's Encrypt challenge files (Certbot writes these during cert issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Certbot will fill in the ssl_certificate paths after `certbot --nginx`
server {
    listen 443 ssl;
    server_name api.yourdomain.com;   # <-- replace with your domain

    # ── SSL certificates (managed by Certbot) ────────────────────────────────
    # These lines will be uncommented/populated automatically by Certbot.
    # ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "DENY"            always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header X-XSS-Protection       "1; mode=block"   always;
    add_header Referrer-Policy        "strict-origin"   always;

    # ── Request size limit ────────────────────────────────────────────────────
    # 10 MB is plenty for product images sent as URLs (not uploads).
    # Increase if you add direct file upload support later.
    client_max_body_size 10M;

    # ── Proxy all /api/* requests to the Node.js backend on port 3000 ────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;   # Node listens here (localhost only)
        proxy_http_version 1.1;

        # Required headers for WebSocket upgrades and correct IP forwarding
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't serve a cached response — let Node handle it
        proxy_cache_bypass $http_upgrade;

        # Timeouts — raise these if you have slow DB queries or large payloads
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── Health check endpoint (used by monitoring tools / load balancers) ─────
    location /health {
        proxy_pass http://127.0.0.1:3000/api/health;
    }

    # ── Block direct access to hidden files (e.g. .env, .git) ────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
