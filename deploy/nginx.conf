# =============================================================================
# DEPRECATED — this file has been split into two deployment-specific configs.
#
#   Docker Compose  →  use deploy/nginx.docker.conf
#                      (proxy_pass http://backend:3000, alias /var/www/uploads/)
#
#   PM2 / bare VPS  →  use deploy/nginx.host.conf
#                      (proxy_pass http://127.0.0.1:3000,
#                       alias /home/deploy/app/backend/uploads/)
#
# This file is kept for reference only. Do not use it for new deployments.
# =============================================================================

# Redirect plain HTTP → HTTPS so all traffic is encrypted.
# Certbot will update this block with the SSL redirect after step 5.
server {
    listen 80;
    server_name api.yourdomain.com;   # <-- replace with your domain

    # Let's Encrypt challenge files (Certbot writes these during cert issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Certbot will fill in the ssl_certificate paths after `certbot --nginx`
server {
    listen 443 ssl;
    server_name api.yourdomain.com;   # <-- replace with your domain

    # ── SSL certificates (managed by Certbot) ────────────────────────────────
    # These lines will be uncommented/populated automatically by Certbot.
    # ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options        "DENY"            always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header X-XSS-Protection       "1; mode=block"   always;
    add_header Referrer-Policy        "strict-origin"   always;

    # ── Request size limit ────────────────────────────────────────────────────
    # 8 files × 5 MB max = 40 MB theoretical max per upload request.
    # 42 M gives a small buffer above that ceiling.
    client_max_body_size 42M;

    # ── Serve uploaded product images as static files (no Node.js overhead) ──
    # Docker: the product_uploads volume is mounted at /var/www/uploads (ro).
    # PM2/host: change alias to the absolute path of backend/uploads/ on disk.
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Proxy all /api/* requests to the Node.js backend on port 3000 ────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;   # Node listens here (localhost only)
        proxy_http_version 1.1;

        # Required headers for WebSocket upgrades and correct IP forwarding
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't serve a cached response — let Node handle it
        proxy_cache_bypass $http_upgrade;

        # Timeouts — raise these if you have slow DB queries or large payloads
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── Health check endpoint (used by monitoring tools / load balancers) ─────
    location /health {
        proxy_pass http://127.0.0.1:3000/api/health;
    }

    # ── Block direct access to hidden files (e.g. .env, .git) ────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
