# =============================================================================
# admin/netlify.toml — Netlify build configuration for the admin dashboard
#
# Deploy as a SEPARATE Netlify site from the storefront (different URL).
# Recommended URL: admin.yourdomain.com or yourdomain-admin.netlify.app
# =============================================================================

[build]
  publish = "dist"
  command = "npm run build"

# ── SPA redirect rule ─────────────────────────────────────────────────────────
# Same reason as the frontend — React Router needs all paths to serve index.html.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
