name: iOS Build & Verify (macOS)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Production HTTPS API URL (e.g. https://api.yourdomain.com/api)'
        required: true
        default: 'https://api.bodycreamgh.com/api'
      storefront_url:
        description: 'Production HTTPS Storefront URL (e.g. https://yourdomain.com)'
        required: true
        default: 'https://bodycreamgh.com'
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter test suite
        run: flutter test

      - name: Build iOS Release (unsigned for CI verification)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_URL=${{ github.event.inputs.api_url || 'https://api.bodycreamgh.com/api' }} \
            --dart-define=STOREFRONT_URL=${{ github.event.inputs.storefront_url || 'https://bodycreamgh.com' }}

      - name: Upload iOS Runner.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-runner-unsigned
          path: mobile/build/ios/iphoneos/Runner.app
          retention-days: 7
